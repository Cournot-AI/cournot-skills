name: Publish Cournot Skill to ClawHub

on:
  pull_request:
    paths:
      - "skills/cournot/**"
      - ".github/workflows/clawhub-publish.yml"
  workflow_dispatch:
    inputs:
      changelog:
        description: Briefly describe this ClawHub release
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@611753edc59cb103139d9dec48afede4ed09159f
    with:
      owner: cournot-ai
      skill_path: skills/cournot
      dry_run: true
      categories: finance,research,integrations
      topics: prediction-markets,forecasting,probability,market-data,cournot

  publish:
    if: github.event_name == 'workflow_dispatch'
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@611753edc59cb103139d9dec48afede4ed09159f
    with:
      owner: cournot-ai
      skill_path: skills/cournot
      dry_run: false
      changelog: ${{ inputs.changelog }}
      categories: finance,research,integrations
      topics: prediction-markets,forecasting,probability,market-data,cournot
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
